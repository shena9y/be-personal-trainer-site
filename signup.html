<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create an account — Be Personal Trainer</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101018" />
    <link rel="icon" href="icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #ff5a1f;
        --orange-deep: #c2410c;
        --dark: #101018;
        --ink-2: #1c1c26;
        --muted: #9aa0aa;
        --line: rgba(255, 255, 255, 0.1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 600px at 80% -10%, #23232f 0%, var(--dark) 55%);
        color: #fff;
        font: 16px/1.6 Roboto, system-ui, sans-serif;
        padding: 40px 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--ink-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 36px 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: Oswald, Impact, sans-serif;
        font-weight: 700;
        font-size: 22px;
        text-transform: lowercase;
        color: #fff;
        text-decoration: none;
        margin-bottom: 8px;
      }
      .logo small {
        display: block;
        font-size: 8px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-family: Oswald, Impact, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 26px;
        margin: 22px 0 4px;
      }
      .sub { color: var(--muted); margin: 0 0 24px; }
      .field { display: block; margin-bottom: 16px; }
      .field span {
        display: block;
        font-family: "Share Tech Mono", monospace;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        font: inherit;
        padding: 11px 13px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--dark);
        color: #fff;
      }
      .field input:focus { outline: 3px solid var(--orange); outline-offset: 2px; border-color: transparent; }
      .err { color: #f87171; font-size: 13px; display: block; min-height: 1.2em; margin-top: 4px; }
      .btn {
        width: 100%;
        font-family: Oswald, sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 17px;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        background: var(--orange-deep);
        color: #fff;
        margin-top: 6px;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .foot { text-align: center; color: var(--muted); margin-top: 20px; font-size: 14px; }
      .foot a { color: var(--orange); }
      .status { text-align: center; min-height: 1.5em; margin: 14px 0 0; font-size: 14px; }
      .status.err { color: #f87171; }
      .back { display: block; text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; text-decoration: none; }
      .back:hover { color: var(--orange); }

      /* show / hide password */
      .field .pw-wrap { display: block; position: relative; margin: 0; }
      .field .pw-wrap input { padding-right: 72px; }
      .pw-toggle {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 9px;
        cursor: pointer;
      }
      .pw-toggle:hover { color: var(--orange); border-color: var(--orange); }

      /* password strength meter */
      .field .meter { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; }
      .field .meter[hidden] { display: none; }
      .field .meter .bars { display: flex; gap: 4px; flex: 1; margin: 0; }
      .field .meter .bars i {
        display: block;
        height: 4px;
        flex: 1;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        transition: background 0.15s ease;
      }
      .field .meter-label {
        font-family: "Share Tech Mono", monospace;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0;
        min-width: 96px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a class="logo" href="/" aria-label="Be Personal Trainer home">
        <svg viewBox="0 0 40 20" width="40" height="20" aria-hidden="true">
          <path fill="#ff5a1f" d="M4 4h5v12H4zM31 4h5v12h-5zM9 8h22v4H9z" />
        </svg>
        <span>be personal<small>trainer</small></span>
      </a>
      <h1>Create an account</h1>
      <p class="sub">Your own dashboard for plans, progress and messages.</p>

      <form id="signupForm" novalidate>
        <label class="field">
          <span>Name</span>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required autofocus />
          <span class="err" id="name-err"></span>
        </label>
        <label class="field">
          <span>E-mail</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          <span class="err" id="email-err"></span>
        </label>
        <label class="field">
          <span>Password</span>
          <span class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required />
            <button class="pw-toggle" id="pwToggle" type="button" aria-pressed="false">Show</button>
          </span>
          <span class="meter" id="meter" hidden>
            <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="meter-label" id="meterLabel"></span>
          </span>
          <span class="err" id="password-err"></span>
        </label>
        <button class="btn" id="submit" type="submit">Create account</button>
      </form>
      <p class="status" id="status" role="status"></p>
      <p class="foot">
        Already have an account? <a href="/login.html">Sign in</a>
      </p>
      <a class="back" href="/">&larr; Back to the site</a>
    </div>

    <script>
      const form = document.getElementById('signupForm');
      const status = document.getElementById('status');
      const btn = document.getElementById('submit');
      const nameEl = document.getElementById('name');
      const emailEl = document.getElementById('email');
      const pwEl = document.getElementById('password');
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      /* Show / hide password */
      const pwToggle = document.getElementById('pwToggle');
      pwToggle.addEventListener('click', () => {
        const show = pwEl.type === 'password';
        pwEl.type = show ? 'text' : 'password';
        pwToggle.textContent = show ? 'Hide' : 'Show';
        pwToggle.setAttribute('aria-pressed', String(show));
        pwEl.focus();
      });

      /* Live strength meter */
      const meter = document.getElementById('meter');
      const bars = [...meter.querySelectorAll('.bars i')];
      const meterLabel = document.getElementById('meterLabel');
      const STRENGTH_COLORS = { 1: '#f87171', 2: '#fbbf24', 3: '#a3e635', 4: '#34d399' };
      const STRENGTH_LABELS = { 1: 'Too short', 2: 'Weak', 3: 'Okay', 4: 'Strong' };

      const strengthOf = (v) => {
        if (!v) return 0;
        if (v.length < 8) return 1;
        let s = 2;
        if (v.length >= 12) s++;
        if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
        if (/\d/.test(v)) s++;
        if (/[^A-Za-z0-9]/.test(v)) s++;
        return Math.min(s, 4);
      };

      pwEl.addEventListener('input', () => {
        const s = strengthOf(pwEl.value);
        meter.hidden = s === 0;
        bars.forEach((b, i) => {
          b.style.background = i < s ? STRENGTH_COLORS[s] : '';
        });
        meterLabel.textContent = s ? STRENGTH_LABELS[s] : '';
      });

      /* Where to go after signing up: a same-site path from ?next=, else the dashboard. */
      const rawNext = new URLSearchParams(location.search).get('next') || '';
      const next = /^\/(?!\/)/.test(rawNext) ? rawNext : '/dashboard.html';

      /* Already signed in? Skip the form entirely. */
      (async () => {
        try {
          const res = await fetch('/api/auth/me', { headers: { accept: 'application/json' } });
          if (res.ok) {
            const { user } = await res.json().catch(() => ({}));
            if (user) window.location.replace(next);
          }
        } catch {
          /* server unreachable or page opened as a plain file — just show the form */
        }
      })();

      const setErr = (id, msg) => { document.getElementById(id).textContent = msg || ''; };
      const setBusy = (busy) => {
        btn.disabled = busy;
        btn.textContent = busy ? 'Creating account…' : 'Create account';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.textContent = '';
        status.className = 'status';
        setErr('name-err', '');
        setErr('email-err', '');
        setErr('password-err', '');

        const name = nameEl.value.trim();
        const email = emailEl.value.trim();
        const password = pwEl.value;

        /* Instant client-side checks — the server re-validates everything. */
        const fields = {};
        if (!name) fields.name = 'Please enter your name.';
        if (!email) fields.email = 'Please enter your e-mail address.';
        else if (!EMAIL_RE.test(email)) fields.email = 'Enter a valid e-mail address.';
        if (password.length < 8) fields.password = 'Password must be at least 8 characters long.';
        if (Object.keys(fields).length) {
          setErr('name-err', fields.name || '');
          setErr('email-err', fields.email || '');
          setErr('password-err', fields.password || '');
          (fields.name ? nameEl : fields.email ? emailEl : pwEl).focus();
          return;
        }

        setBusy(true);
        try {
          const res = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const srv = (data.error && data.error.fields) || {};
            setErr('name-err', srv.name || '');
            setErr('email-err', srv.email || '');
            setErr('password-err', srv.password || '');
            status.textContent = (data.error && data.error.message) || 'Could not create your account.';
            status.className = 'status err';
            setBusy(false);
            return;
          }
          window.location.href = next; // button stays disabled while navigating
        } catch (err) {
          status.textContent = 'Network error — please try again.';
          status.className = 'status err';
          setBusy(false);
        }
      });
    </script>
  </body>
</html>
